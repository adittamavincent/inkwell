[package]
name = "inkwell"
version = "0.1.0"
edition = "2021"
description = "Inkwell — system-wide keystroke logger that syncs into an Obsidian (Cogdex) vault"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
rusqlite = "0.31"
chrono = "0.4"
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
log = "0.4"
env_logger = "0.11"
lazy_static = "1"
# Frontmost-app detection (so we can label + filter captured keystrokes).
objc = "0.2"
# At-rest encryption of captured keystrokes (AES-256-GCM).
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# --- cargo-packager: bundles the pure-Rust binary into a native macOS .app/.dmg ---
# (replaces the Tauri CLI bundler we dropped). Run `cargo packager --release`.
[package.metadata.packager]
product-name = "Inkwell"
identifier = "com.inkwell.app"
category = "Utility"
formats = ["app", "dmg"]
# Pin the target so the release binary always lands in
# target/aarch64-apple-darwin/release, which is what cargo-packager looks for
# (this Mac is Apple Silicon, so aarch64 is the host triple anyway).
target-triple = "aarch64-apple-darwin"
before-packaging-command = "cargo build --release --target aarch64-apple-darwin"
icons = ["icons/icon.icns"]

# --- macOS codesigning ---
# `signing-identity` is a placeholder: cargo-packager 0.11.x does NOT interpolate
# ${ENV} in this field, so the release workflow rewrites this exact line with the
# real "Developer ID Application" identity pulled from the APPLE_SIGNING_IDENTITY
# secret (see .github/workflows/release.yml). It MUST be a Developer ID identity
# so the resulting .app/.dmg can be notarized. If the value is ever empty,
# cargo-packager fails loudly instead of producing an unsigned (ad-hoc) bundle.
[package.metadata.packager.macos]
signing-identity = "-"
