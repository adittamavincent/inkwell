<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#163b54"/>
      <stop offset="1" stop-color="#1f6f78"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfb"/>
      <stop offset="1" stop-color="#cdd9d3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square ink background -->
  <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#bg)"/>

  <!-- Fountain-pen nib -->
  <path d="M 422 352
           C 466 298, 558 298, 602 352
           C 668 462, 566 642, 512 786
           C 458 642, 356 462, 422 352 Z"
        fill="url(#nib)" stroke="#aebcb6" stroke-width="3"/>

  <!-- Slit -->
  <rect x="506" y="428" width="12" height="322" rx="6" fill="#163b54"/>

  <!-- Breather hole -->
  <circle cx="512" cy="396" r="30" fill="#163b54"/>

  <!-- Soft sheen -->
  <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#sheen)"/>
</svg>
