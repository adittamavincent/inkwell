[project]
name = "inkwell"
version = "0.1.0"
description = "macOS keystroke daemon using CGEventTap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-Quartz>=10.2",
    "pyobjc-framework-Cocoa>=10.2",
]

[project.scripts]
inkwell = "inkwell.app:main"
inkwell-daemon = "inkwell.daemon:main"
inkwell-diary = "inkwell.diary:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
