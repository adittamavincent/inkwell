# =============================================================================
# Inkwell — macOS release: unsigned (ad-hoc) .dmg + .zip attached to draft release
# =============================================================================
#
# Triggered on every pushed tag.
# Produces an unsigned, ad-hoc .dmg and .zip (Apple Silicon arm64) and attaches
# them to a DRAFT GitHub Release. No Apple Developer ID certificate, no
# notarization, and no staples are used because the project is released without
# a paid Apple Developer Program membership.
# =============================================================================

name: Release macOS app

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          echo "Runner architecture: $(uname -m)"
          echo "Node architecture: $(node -p 'process.arch' 2>/dev/null || true)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::This release must run natively on an Apple Silicon arm64 runner."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Python 3.11 for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (26.x)
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

      # -----------------------------------------------------------------------
      # Package (.app / .dmg / .zip) with electron-builder
      # -----------------------------------------------------------------------
      - name: Build & Package with electron-builder
        run: |
          pnpm run build

      # -----------------------------------------------------------------------
      # Locate artifacts. The .app itself will be ad-hoc signed; no notarization
      # or stapling is performed.
      # -----------------------------------------------------------------------
      - name: Locate zipped .app
        run: |
          DMG=$(find dist -maxdepth 1 -name '*.dmg' | head -n1)
          ZIP=$(find dist -maxdepth 1 -name '*.zip' | head -n1)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Attach the unsigned .dmg + zipped .app to a DRAFT release.
      # -----------------------------------------------------------------------
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --notes="Automated macOS build — unsigned (ad-hoc), not notarized. macOS Gatekeeper will block it on first launch; see README for how to open it." \
            "$DMG" "$ZIP"
