# =============================================================================
# Inkwell — macOS release: package, Developer ID codesign, notarize, staple
# =============================================================================
#
# Triggered on every pushed tag (mirrors the Cogdex plugin's release convention).
# Produces a Developer-ID-signed, notarized, and stapled .dmg and attaches it to
# a DRAFT GitHub Release (same draft pattern Cogdex uses).
#
# -----------------------------------------------------------------------------
# REQUIRED GitHub repository secrets
# -----------------------------------------------------------------------------
#   APPLE_CERTIFICATE            Base64-encoded "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD   Password of the .p12 above
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Jane Doe (TEAMID1234)"
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_TEAM_ID                Apple Developer Team ID
#   APPLE_APP_SPECIFIC_PASSWORD  App-specific password for notarization
#                                (or use APPLE_API_KEY_ID / APPLE_API_ISSUER /
#                                 APPLE_API_KEY for API-key-based notarization
#                                 instead — see the notarize step below)
#   KEYCHAIN_PASSWORD            Password for the temporary keychain created here
#
# PREREQUISITE (cannot be worked around in CI): an active paid Apple Developer
# Program membership ($99/yr) with a "Developer ID Application" certificate
# already generated. Without it this pipeline CANNOT produce a Gatekeeper-clean
# build, so it fails loudly instead of publishing an unsigned .dmg.
#
# NOTE on entitlements: cargo-packager enables the hardened runtime
# (`--options runtime`) by default, which notarization requires. If Inkwell's
# GPU/wgpu stack later trips notarization (e.g. "executable requires the
# com.apple.security.cs.allow-unsigned-executable-memory entitlement"), add an
# entitlements .plist and reference it via `entitlements` under
# [package.metadata.packager.macos] in Cargo.toml.
# =============================================================================

name: Release macOS app

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      # Exported job-wide so the packaging step can inject it into Cargo.toml.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # Guard: fail fast & loudly if any required secret is missing, so we never
      # fall through to publishing an unsigned build.
      # -----------------------------------------------------------------------
      - name: Verify required secrets are present
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret '$v' is not set. Refusing to build an unsigned release."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Rust toolchain (stable, aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # -----------------------------------------------------------------------
      # Step 4: import the Developer ID certificate into a temporary keychain.
      # -----------------------------------------------------------------------
      - name: Set up keychain and import codesign certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/inkwell.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/inkwell.p12"
          security import "$RUNNER_TEMP/inkwell.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/inkwell.p12"

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      # -----------------------------------------------------------------------
      # Inject the real signing identity (from the secret) into Cargo.toml.
      # cargo-packager 0.11.x does not interpolate ${ENV} in this field, so we
      # rewrite the committed placeholder line with the actual identity.
      # (Avoids echoing the secret: the sed command is not printed by default.)
      # -----------------------------------------------------------------------
      - name: Inject signing identity into Cargo.toml
        run: |
          # cargo-packager 0.11.x does not interpolate ${ENV} in this field, so
          # rewrite the committed placeholder line with the real identity from
          # the secret. Done in Python to stay robust against special chars in
          # the identity (parentheses, spaces). Quoted heredoc => no secret leak.
          python3 - <<'PY'
          import os, re, pathlib
          identity = os.environ["APPLE_SIGNING_IDENTITY"]
          p = pathlib.Path("Cargo.toml")
          text = p.read_text()
          text, n = re.subn(
              r'^signing-identity = .*$',
              f'signing-identity = "{identity}"',
              text,
              flags=re.M,
          )
          assert n == 1, f"expected exactly 1 signing-identity line, found {n}"
          p.write_text(text)
          PY

      # -----------------------------------------------------------------------
      # Step 5: build the binary (packager's before-packaging-command re-runs
      # this too, but an explicit build keeps failures visible early).
      # -----------------------------------------------------------------------
      - name: Build binary
        run: cargo build --release --target aarch64-apple-darwin

      # -----------------------------------------------------------------------
      # Step 6: package + Developer ID codesign the .app/.dmg.
      # -----------------------------------------------------------------------
      - name: Package (.app / .dmg) with Developer ID codesigning
        run: cargo packager --release --target aarch64-apple-darwin

      # -----------------------------------------------------------------------
      # Guard: ensure the .app is genuinely Developer-ID signed (not ad-hoc).
      # -----------------------------------------------------------------------
      - name: Verify codesigning (fail if ad-hoc or unsigned)
        run: |
          APP="target/aarch64-apple-darwin/release/Inkwell.app"
          codesign --verify --strict --verbose=2 "$APP"
          INFO=$(codesign -dvv "$APP" 2>&1)
          if echo "$INFO" | grep -qi "Ad-hoc"; then
            echo "::error::Inkwell.app is ad-hoc signed (no Developer ID). Refusing to publish."
            exit 1
          fi
          if ! echo "$INFO" | grep -q "Developer ID"; then
            echo "::error::Inkwell.app is not signed with a Developer ID identity."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 7: notarize the .dmg.
      # -----------------------------------------------------------------------
      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # App-specific password flow. For API-key notarization instead, drop
          # this step and use:
          #   xcrun notarytool submit "$DMG" \
          #     --key-id "$APPLE_API_KEY_ID" \
          #     --key "$APPLE_API_KEY" \
          #     --issuer "$APPLE_API_ISSUER" --wait
          xcrun notarytool store-credentials "inkwell-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Notarize .dmg
        run: |
          DMG=$(find target/aarch64-apple-darwin/release -maxdepth 1 -name '*.dmg' | head -n1)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          xcrun notarytool submit "$DMG" --keychain-profile "inkwell-notary" --wait

      # -----------------------------------------------------------------------
      # Step 8: staple the notarization ticket (so Gatekeeper works offline).
      # -----------------------------------------------------------------------
      - name: Staple notarization ticket
        run: xcrun stapler staple "$DMG"

      # -----------------------------------------------------------------------
      # Optional convenience artifact: a zipped .app alongside the .dmg.
      # -----------------------------------------------------------------------
      - name: Zip the .app
        run: |
          APP_ZIP="$RUNNER_TEMP/Inkwell.app.zip"
          ditto -c -k --keepParent target/aarch64-apple-darwin/release/Inkwell.app "$APP_ZIP"
          echo "APP_ZIP=$APP_ZIP" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Step 9: attach the stapled .dmg (+ zipped .app) to a DRAFT release.
      # The release is only created if every prior step (sign + notarize +
      # staple) succeeded, so a failed/notarized build is never published.
      # -----------------------------------------------------------------------
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --notes="Automated macOS build — Developer ID signed, notarized, and stapled." \
            "$DMG" "$APP_ZIP"
