# =============================================================================
# Inkwell — macOS release: package, Developer ID codesign, notarize, staple
# =============================================================================
#
# Triggered on every pushed tag.
# Produces a Developer-ID-signed, notarized, and stapled .dmg (Apple Silicon arm64)
# and attaches it to a DRAFT GitHub Release.
#
# -----------------------------------------------------------------------------
# REQUIRED GitHub repository secrets
# -----------------------------------------------------------------------------
#   APPLE_CERTIFICATE            Base64-encoded "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD   Password of the .p12 above
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Jane Doe (TEAMID1234)"
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_TEAM_ID                Apple Developer Team ID
#   APPLE_APP_SPECIFIC_PASSWORD  App-specific password for notarization
#   KEYCHAIN_PASSWORD            Password for the temporary keychain created here
# =============================================================================

name: Release macOS app

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Guard: fail fast & loudly if any required secret is missing, so we never
      # fall through to publishing an unsigned build.
      # -----------------------------------------------------------------------
      - name: Verify required secrets are present
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret '$v' is not set. Refusing to build an unsigned release."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

      # -----------------------------------------------------------------------
      # Import the Developer ID certificate into a temporary keychain.
      # -----------------------------------------------------------------------
      - name: Set up keychain and import codesign certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/inkwell.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/inkwell.p12"
          security import "$RUNNER_TEMP/inkwell.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/inkwell.p12"

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      # -----------------------------------------------------------------------
      # Package (.app / .dmg) with electron-builder
      # -----------------------------------------------------------------------
      - name: Build & Package with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          pnpm run build

      # -----------------------------------------------------------------------
      # Guard: ensure the .app is genuinely Developer-ID signed (not ad-hoc).
      # -----------------------------------------------------------------------
      - name: Verify codesigning (fail if ad-hoc or unsigned)
        run: |
          APP="release/mac-arm64/Inkwell.app"
          codesign --verify --strict --verbose=2 "$APP"
          INFO=$(codesign -dvv "$APP" 2>&1)
          if echo "$INFO" | grep -qi "Ad-hoc"; then
            echo "::error::Inkwell.app is ad-hoc signed (no Developer ID). Refusing to publish."
            exit 1
          fi
          if ! echo "$INFO" | grep -q "Developer ID"; then
            echo "::error::Inkwell.app is not signed with a Developer ID identity."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Notarize the .dmg with Apple notarytool
      # -----------------------------------------------------------------------
      - name: Store notarytool credentials & Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "inkwell-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

          DMG=$(find release -maxdepth 1 -name '*.dmg' | head -n1)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          xcrun notarytool submit "$DMG" --keychain-profile "inkwell-notary" --wait

      # -----------------------------------------------------------------------
      # Staple the notarization ticket
      # -----------------------------------------------------------------------
      - name: Staple notarization ticket
        run: xcrun stapler staple "$DMG"

      - name: Locate zipped .app
        run: |
          ZIP=$(find release -maxdepth 1 -name '*.zip' | head -n1)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Attach the stapled .dmg (+ zipped .app) to a DRAFT release.
      # -----------------------------------------------------------------------
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --notes="Automated macOS build — Developer ID signed, notarized, and stapled." \
            "$DMG" "$ZIP"
