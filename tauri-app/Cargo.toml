[package]
name = "inkwell_tauri"
version = "0.1.0"
edition = "2021"
description = "Inkwell — system-wide keystroke logger that syncs into an Obsidian (Cogdex) vault"
default-run = "inkwell_tauri"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.31"
chrono = { version = "0.4", features = ["serde"] }
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
log = "0.4"
lazy_static = "1"
